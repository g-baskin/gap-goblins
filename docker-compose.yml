name: gap-goblins

services:
  postgres:
    image: postgres:16-alpine
    container_name: gap-goblins-postgres
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gap_goblins
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible storage. MinIO's free images were removed from Docker Hub
  # and Quay in September 2026, so local dev uses SeaweedFS (Apache-2.0) instead.
  # The service keeps the name "minio" and the same host ports, keys and bucket,
  # so .env.example and lib/storage need no changes. Local dev only.
  minio:
    image: chrislusf/seaweedfs:4.48
    container_name: gap-goblins-minio
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer.port=8888 -master.port=9333 -volume.port=8080 -ip=minio -ip.bind=0.0.0.0
    ports:
      - "9010:8333"   # S3 API
      - "9011:8888"   # filer web UI (browse buckets under /buckets)
    volumes:
      - minio_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-setup:
    image: chrislusf/seaweedfs:4.48
    container_name: gap-goblins-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 's3.bucket.create -name media' | weed shell -master=minio:9333 &&
        echo 'Bucket ready: media'
      "

volumes:
  postgres_data:
  minio_data:
